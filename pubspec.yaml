name: flutterproject
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  
  image_picker: ^0.8.7+4
  flutter_svg: ^2.0.7
  fl_chart: ^0.69.0
  webview_flutter: ^4.10.0
  iconsax: ^0.0.8
  http: ^1.2.0
  intl: ^0.18.1
  logger: ^2.0.1
  url_launcher: ^6.1.13
  carousel_slider: ^5.0.0
  flutter_native_splash: ^2.4.1
  smooth_page_indicator: ^1.2.0+3
  shared_preferences: ^2.2.2
  get: ^4.6.5
  get_storage: ^2.1.1
  cupertino_icons: ^1.0.8
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.2"
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/app-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/assets_frontend/
    